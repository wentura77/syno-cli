[tool.poetry]
name = "syno-cli"
version = "0.1.0"
description = "Комплексная CLI-утилита для управления Synology NAS через официальный DSM Web API"
authors = ["Vitalii Kovrigin <wentura77@gmail.com>"]
readme = "README.md"
packages = [{include = "syno_cli"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
typer = ">=0.15.2"
rich = "^13.7.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.1"
platformdirs = "^4.14.2"
cryptography = "^50.0.2"
keyring = "^25.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
mypy = "^1.10.0"
darglint = "^1.8.1"
interrogate = "^1.5.0"
pre-commit = "^4.7.0"
ruff = "^0.17.3"


[tool.poetry.scripts]
syno = "syno_cli.commands.main:run"

[tool.darglint]
docstring_style = "google"
strictness = "full"
ignore_raise = ["DsmApiError", "DsmAuthError", "DsmTaskNotFoundError"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-nested-functions = true
fail-under = 90
exclude = ["tests", ".venv", "dist", "build"]
verbose = 1
color = true
