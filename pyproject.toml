[tool.poetry]
name = "syno-cli"
version = "0.1.0"
description = "Комплексная CLI-утилита для управления Synology NAS через официальный DSM Web API"
authors = ["Admin <admin@example.local>"]
readme = "README.md"
packages = [{include = "syno_cli"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
typer = ">=0.15.2"
rich = "^13.7.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
debugpy = "^1.8.0"

[tool.poetry.scripts]
syno = "syno_cli.commands.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
