default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Валидация формата сообщений коммитов по Conventional Commits
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  # Базовая чистота файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Автоформатирование и линтинг через Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Локальные проверки качества в окружении Poetry
  - repo: local
    hooks:
      - id: interrogate
        name: interrogate (docstrings coverage)
        entry: poetry run interrogate -v syno_cli
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy (type check)
        entry: poetry run mypy syno_cli tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (unit & mock tests)
        entry: poetry run pytest -v
        language: system
        pass_filenames: false
        stages: [pre-push]
